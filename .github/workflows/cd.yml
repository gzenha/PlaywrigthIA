# Continuous Deployment — Preview isolado + rebuild de Production
#
# Decisão: não usamos `vercel promote` do preview (VITE_* ficam no bundle).
# Depois do E2E, rebuild com --environment=production e deploy --prod.

name: Continuous Deployment

on:
  push:
    branches:
      - master
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-and-deploy-preview:
    name: Build & Deploy Vercel Preview
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Link Vercel project (from secrets)
        run: |
          mkdir -p .vercel
          printf '%s' "{\"projectId\":\"${VERCEL_PROJECT_ID}\",\"orgId\":\"${VERCEL_ORG_ID}\"}" > .vercel/project.json
          echo "Linked project.json:"
          cat .vercel/project.json

      - name: Pull Vercel Config (preview)
        run: yarn vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel (preview)
        run: yarn vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt \
            --target=preview \
            --token="$VERCEL_TOKEN")
          echo "Preview URL: $URL"
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests (against Preview)
    needs: [build-and-deploy-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Show Preview URL
        run: echo "BASE_URL=${{ needs.build-and-deploy-preview.outputs.deployment-url }}"
      - name: Run E2E against Preview URL
        run: yarn playwright test
        env:
          CI: true
          BASE_URL: ${{ needs.build-and-deploy-preview.outputs.deployment-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy-production:
    name: Build & Deploy Production
    needs: [build-and-deploy-preview, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Link Vercel project (from secrets)
        run: |
          mkdir -p .vercel
          printf '%s' "{\"projectId\":\"${VERCEL_PROJECT_ID}\",\"orgId\":\"${VERCEL_ORG_ID}\"}" > .vercel/project.json
          cat .vercel/project.json

      - name: Pull Vercel Config (production)
        run: yarn vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel (production)
        run: yarn vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: |
          yarn vercel deploy --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
